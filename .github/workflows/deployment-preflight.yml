name: Deployment Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify pnpm version
        run: |
          EXPECTED_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ pnpm version mismatch: expected $EXPECTED_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi
          echo "✅ pnpm version $ACTUAL_VERSION matches package.json"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Public deployment protocol check
        run: pnpm public:deployment-protocol

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Cockpit lifecycle contract
        run: pnpm test:cockpit-source

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Public dashboard leakage check
        run: pnpm check:public-dashboard-leakage

      - name: Install browser for Cockpit regression
        run: pnpm exec playwright install --with-deps chromium

      - name: Cockpit browser regression against production build
        timeout-minutes: 4
        run: pnpm test:cockpit-browser

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-browser-failure
          path: test-results/
          retention-days: 7
