<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#0f1f4b}.sub{font-size:22px;fill:#52627a}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#28364d}.small{font-size:16px;fill:#46566f}.metric{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.soft{fill:#f7fafc;stroke:#d9e2ef;stroke-width:2}.teal{fill:#0f7c82}.blue{fill:#174ea6}.green{fill:#14804a}.purple{fill:#4b3bb5}.amber{fill:#d97706}.red{fill:#c62828}</style><rect width="1400" height="788" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><circle cx="64" cy="62" r="38" class="teal"/><text x="64" y="75" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">4</text><text x="120" y="70" class="title">A small governed package proved the data path first</text><text x="120" y="108" class="sub">Correctness and traceability before volume</text><rect x="40" y="150" width="300" height="160" rx="20" class="card"/><text x="190" y="225" text-anchor="middle" class="metric teal">11</text><text x="190" y="270" text-anchor="middle" class="h">canonical CSV tables</text><rect x="380" y="150" width="300" height="160" rx="20" class="card"/><text x="530" y="225" text-anchor="middle" class="metric purple">805</text><text x="530" y="270" text-anchor="middle" class="h">source rows</text><rect x="720" y="150" width="300" height="160" rx="20" class="card"/><text x="870" y="225" text-anchor="middle" class="metric green">1</text><text x="870" y="270" text-anchor="middle" class="h">generation manifest</text><rect x="1060" y="150" width="300" height="160" rx="20" class="card"/><text x="1210" y="225" text-anchor="middle" class="metric teal">806</text><text x="1210" y="270" text-anchor="middle" class="h">total Bronze rows</text><rect x="40" y="350" width="1320" height="220" rx="20" class="soft"/><text x="70" y="392" class="h blue">Validation checklist: the governed data path was proven end-to-end.</text><text x="95" y="455" class="b">✓ contract compatibility</text><text x="350" y="455" class="b">✓ provenance retention</text><text x="610" y="455" class="b">✓ referential relationships</text><text x="900" y="455" class="b">✓ event-order rules</text><text x="1150" y="455" class="b">✓ ADLS landing</text><text x="95" y="510" class="b">✓ byte-level read-back</text><text x="350" y="510" class="b">✓ Unity Catalog access</text><text x="610" y="510" class="b">✓ Bronze ingestion</text><text x="900" y="510" class="b">✓ Silver transformation</text><text x="1150" y="510" class="b">✓ model-ready construction</text><rect x="40" y="600" width="1320" height="60" rx="20" fill="#eaf7f7" stroke="#9acfd1"/><text x="700" y="638" text-anchor="middle" class="b">The first package was intentionally small. It proved the governed data path before larger synthetic expansion.</text><rect x="40" y="675" width="1320" height="52" rx="18" fill="#fff0f0" stroke="#df8b8b"/><text x="700" y="708" text-anchor="middle" class="h red">Large volume before stable Silver would have amplified invalid relationships or transformation defects.</text><text x="700" y="760" text-anchor="middle" class="h blue">Result: correctness and traceability first — not volume.</text></svg>