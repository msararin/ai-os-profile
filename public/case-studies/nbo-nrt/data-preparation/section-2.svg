<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#0f1f4b}.sub{font-size:22px;fill:#52627a}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#28364d}.small{font-size:16px;fill:#46566f}.metric{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.soft{fill:#f7fafc;stroke:#d9e2ef;stroke-width:2}.teal{fill:#0f7c82}.blue{fill:#174ea6}.green{fill:#14804a}.purple{fill:#4b3bb5}.amber{fill:#d97706}.red{fill:#c62828}</style><rect width="1400" height="788" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><circle cx="64" cy="62" r="38" class="teal"/><text x="64" y="75" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">2</text><text x="120" y="70" class="title">Flexible composition was a response to limited direct-fit data</text><text x="120" y="108" class="sub">Bounded source roles and explicit synthetic assumptions</text><rect x="420" y="125" width="560" height="52" rx="26" fill="#e7f6f6" stroke="#0f7c82"/><text x="700" y="158" text-anchor="middle" class="h teal">Very little direct-fit data could be used as-is</text><rect x="40" y="210" width="300" height="170" rx="20" class="card"/><text x="190" y="255" text-anchor="middle" class="h teal">Bank Marketing</text><text x="190" y="300" text-anchor="middle" class="b">response and methodology patterns</text><rect x="380" y="210" width="300" height="170" rx="20" class="card"/><text x="530" y="255" text-anchor="middle" class="h purple">TMF620</text><text x="530" y="300" text-anchor="middle" class="b">product and offer catalogue structure</text><rect x="720" y="210" width="300" height="170" rx="20" class="card"/><text x="870" y="255" text-anchor="middle" class="h green">OTTO documentation</text><text x="870" y="300" text-anchor="middle" class="b">recommendation-pattern reference</text><rect x="1060" y="210" width="300" height="170" rx="20" class="card"/><text x="1210" y="255" text-anchor="middle" class="h blue">MIND documentation</text><text x="1210" y="300" text-anchor="middle" class="b">ranking and exposure-pattern reference</text><path d="M190 380 V430 H700" stroke="#7c8aa0" stroke-width="3" fill="none"/><path d="M530 380 V430 H700" stroke="#7c8aa0" stroke-width="3" fill="none"/><path d="M870 380 V430 H700" stroke="#7c8aa0" stroke-width="3" fill="none"/><path d="M1210 380 V430 H700" stroke="#7c8aa0" stroke-width="3" fill="none"/><path d="M700 430 V470" stroke="#7c8aa0" stroke-width="3"/><polygon points="690,462 710,462 700,478" fill="#7c8aa0"/><rect x="450" y="475" width="500" height="120" rx="22" fill="#f1effc" stroke="#9f8ee8" stroke-width="2"/><text x="700" y="525" text-anchor="middle" class="h purple">Flexible composite design</text><text x="700" y="565" text-anchor="middle" class="b">source structure + explicit assumptions + provenance</text><rect x="40" y="475" width="360" height="120" rx="20" fill="#eaf7f7" stroke="#8fcacb"/><text x="220" y="515" text-anchor="middle" class="b">Missing customer–offer–exposure–response</text><text x="220" y="545" text-anchor="middle" class="b">links were generated under</text><text x="220" y="575" text-anchor="middle" class="h teal">explicit synthetic assumptions.</text><rect x="1000" y="455" width="360" height="160" rx="20" class="soft"/><text x="1180" y="490" text-anchor="middle" class="h blue">Provenance retained</text><text x="1035" y="525" class="b">• synthetic identifiers</text><text x="1035" y="555" class="b">• relationship origins</text><text x="1035" y="585" class="b">• generation-run and evidence-lane fields</text><rect x="40" y="650" width="1320" height="95" rx="20" fill="#edf9f1" stroke="#8ac59f"/><text x="700" y="688" text-anchor="middle" class="h green">Use real source structure where suitable. Generate only missing relationships.</text><text x="700" y="723" text-anchor="middle" class="h green">Never present generated relationships as observed operator behaviour.</text></svg>