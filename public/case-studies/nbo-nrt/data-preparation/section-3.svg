<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#0f1f4b}.sub{font-size:22px;fill:#52627a}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#28364d}.small{font-size:16px;fill:#46566f}.metric{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.soft{fill:#f7fafc;stroke:#d9e2ef;stroke-width:2}.teal{fill:#0f7c82}.blue{fill:#174ea6}.green{fill:#14804a}.purple{fill:#4b3bb5}.amber{fill:#d97706}.red{fill:#c62828}</style><rect width="1400" height="788" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><circle cx="64" cy="62" r="38" class="teal"/><text x="64" y="75" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">3</text><text x="120" y="70" class="title">AIOS governance remained visible during research and preparation</text><text x="120" y="108" class="sub">Governed research before the Databricks implementation stage</text><rect x="420" y="125" width="560" height="52" rx="26" fill="#edf9f1" stroke="#14804a"/><text x="700" y="158" text-anchor="middle" class="h green">Governance added speed, clarity, and traceability</text><rect x="40" y="210" width="200" height="210" rx="20" class="card"/><text x="140" y="260" text-anchor="middle" class="metric teal">1</text><text x="140" y="320" text-anchor="middle" class="h">Role separation</text><rect x="265" y="210" width="200" height="210" rx="20" class="card"/><text x="365" y="260" text-anchor="middle" class="metric purple">2</text><text x="365" y="310" text-anchor="middle" class="h">Assumption and</text><text x="365" y="340" text-anchor="middle" class="h">provenance tracking</text><rect x="490" y="210" width="200" height="210" rx="20" class="card"/><text x="590" y="260" text-anchor="middle" class="metric green">3</text><text x="590" y="310" text-anchor="middle" class="h">Evidence-lane</text><text x="590" y="340" text-anchor="middle" class="h">separation</text><rect x="715" y="210" width="200" height="210" rx="20" class="card"/><text x="815" y="260" text-anchor="middle" class="metric blue">4</text><text x="815" y="310" text-anchor="middle" class="h">Provider cost</text><text x="815" y="340" text-anchor="middle" class="h">recording</text><rect x="940" y="210" width="200" height="210" rx="20" class="card"/><text x="1040" y="260" text-anchor="middle" class="metric purple">5</text><text x="1040" y="310" text-anchor="middle" class="h">Telemetry and</text><text x="1040" y="340" text-anchor="middle" class="h">validation receipts</text><rect x="1165" y="210" width="195" height="210" rx="20" class="card"/><text x="1262" y="260" text-anchor="middle" class="metric green">6</text><text x="1262" y="300" text-anchor="middle" class="small">proposed → executed</text><text x="1262" y="330" text-anchor="middle" class="small">→ validated → approved</text><rect x="40" y="455" width="1320" height="95" rx="20" fill="#eaf7f7" stroke="#9acfd1"/><text x="700" y="495" text-anchor="middle" class="b">These controls explain which elements came from public evidence, which were documented assumptions,</text><text x="700" y="530" text-anchor="middle" class="b">and which were generated for the experiment.</text><rect x="40" y="580" width="1320" height="100" rx="20" fill="#eef5ff" stroke="#9dbbea"/><text x="90" y="622" class="h blue">Scope boundary</text><text x="280" y="615" class="b">This governance description applies to research and pre-Databricks data preparation.</text><text x="280" y="648" class="b">ADLS, Silver, MLflow, registry, and read-back were separate platform execution activities.</text><rect x="40" y="705" width="1320" height="50" rx="20" fill="#edf5ff" stroke="#b9d3f7"/><text x="700" y="738" text-anchor="middle" class="h blue">Result: the data-preparation process remained auditable and bounded.</text></svg>