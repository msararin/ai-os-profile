<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#0f1f4b}.sub{font-size:22px;fill:#52627a}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#28364d}.small{font-size:16px;fill:#46566f}.metric{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.soft{fill:#f7fafc;stroke:#d9e2ef;stroke-width:2}.teal{fill:#0f7c82}.blue{fill:#174ea6}.green{fill:#14804a}.purple{fill:#4b3bb5}.amber{fill:#d97706}.red{fill:#c62828}</style><rect width="1400" height="788" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><circle cx="64" cy="62" r="38" class="teal"/><text x="64" y="75" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">5</text><text x="120" y="70" class="title">Volume was added after Silver for model learning</text><text x="120" y="108" class="sub">Controlled synthetic generation for model behaviour analysis</text><rect x="40" y="135" width="1320" height="58" rx="20" fill="#eaf7f7" stroke="#9acfd1"/><text x="700" y="172" text-anchor="middle" class="h teal">After Silver passed, the question changed from data-path proof to model behaviour.</text><rect x="40" y="220" width="1320" height="180" rx="22" fill="#f7f5ff" stroke="#c8bdf2"/><text x="85" y="265" class="h purple">Synthetic observation =</text><text x="360" y="265" class="b">customer context + eligible candidate + selected action</text><text x="360" y="305" class="b">+ action probability + outcome probability + sampled response</text><line x1="80" y1="330" x2="1320" y2="330" stroke="#d6cee9"/><text x="230" y="370" class="h purple">response = 1 when random_value &lt; outcome_probability</text><text x="850" y="370" class="h purple">response ~ Bernoulli(outcome_probability)</text><text x="60" y="445" class="h teal">Data distribution</text><rect x="40" y="465" width="170" height="135" rx="18" class="card"/><text x="125" y="515" text-anchor="middle" class="metric teal">10,000</text><text x="125" y="555" text-anchor="middle" class="small">total observations</text><rect x="225" y="465" width="170" height="135" rx="18" class="card"/><text x="310" y="515" text-anchor="middle" class="metric green">3,148</text><text x="310" y="555" text-anchor="middle" class="small">positive labels</text><rect x="410" y="465" width="170" height="135" rx="18" class="card"/><text x="495" y="515" text-anchor="middle" class="metric amber">6,852</text><text x="495" y="555" text-anchor="middle" class="small">negative labels</text><rect x="595" y="465" width="170" height="135" rx="18" class="card"/><text x="680" y="515" text-anchor="middle" class="metric purple">31.48%</text><text x="680" y="555" text-anchor="middle" class="small">positive rate</text><rect x="780" y="465" width="170" height="135" rx="18" class="card"/><text x="865" y="515" text-anchor="middle" class="metric blue">8,002</text><text x="865" y="555" text-anchor="middle" class="small">train rows</text><rect x="965" y="465" width="170" height="135" rx="18" class="card"/><text x="1050" y="515" text-anchor="middle" class="metric blue">1,998</text><text x="1050" y="555" text-anchor="middle" class="small">test rows</text><rect x="1150" y="465" width="210" height="135" rx="18" fill="#eef5ff" stroke="#9dbbea"/><text x="1255" y="515" text-anchor="middle" class="metric blue">0</text><text x="1255" y="550" text-anchor="middle" class="small">cross-split customers</text><text x="1255" y="580" text-anchor="middle" class="small">deterministic split</text><rect x="40" y="630" width="1320" height="75" rx="20" fill="#edf9f1" stroke="#8ac59f"/><text x="700" y="662" text-anchor="middle" class="b">Not forced to 50/50: threshold 0.50 produced no positive predictions;</text><text x="700" y="690" text-anchor="middle" class="b">threshold 0.24 improved recall but retained low precision.</text><rect x="40" y="720" width="1320" height="48" rx="18" fill="#edf5ff" stroke="#b9d3f7"/><text x="700" y="751" text-anchor="middle" class="h blue">Result: reveal model behaviour and trade-offs — not manufacture a successful metric.</text></svg>