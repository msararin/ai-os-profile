<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#0f1f4b}.sub{font-size:22px;fill:#52627a}.h{font-size:22px;font-weight:700}.b{font-size:18px;fill:#28364d}.small{font-size:16px;fill:#46566f}.metric{font-size:38px;font-weight:700}.card{fill:#fff;stroke:#d9e2ef;stroke-width:2}.soft{fill:#f7fafc;stroke:#d9e2ef;stroke-width:2}.teal{fill:#0f7c82}.blue{fill:#174ea6}.green{fill:#14804a}.purple{fill:#4b3bb5}.amber{fill:#d97706}.red{fill:#c62828}</style><rect width="1400" height="788" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><circle cx="64" cy="62" r="38" class="teal"/><text x="64" y="75" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">1</text><text x="120" y="70" class="title">Existing AIOS agents accelerated candidate research</text><text x="120" y="108" class="sub">From multi-agent research to a bounded candidate set</text><rect x="1040" y="40" width="300" height="52" rx="26" fill="#e7f6f6" stroke="#0f7c82"/><text x="1190" y="73" text-anchor="middle" class="h teal">10 public candidates assessed</text><rect x="40" y="150" width="400" height="210" rx="22" class="card"/><circle cx="105" cy="220" r="42" fill="#e7f6f6"/><text x="105" y="229" text-anchor="middle" font-size="30" class="teal">R</text><text x="170" y="205" class="h teal">Research Team</text><text x="170" y="242" class="b">searched, compared, and documented</text><text x="170" y="272" class="b">public candidate sources</text><rect x="500" y="150" width="400" height="210" rx="22" class="card"/><circle cx="565" cy="220" r="42" fill="#eeeafb"/><text x="565" y="229" text-anchor="middle" font-size="30" class="purple">D</text><text x="630" y="205" class="h purple">Data Team</text><text x="630" y="242" class="b">assessed schema, provenance,</text><text x="630" y="272" class="b">relationship gaps, and contracts</text><rect x="960" y="150" width="400" height="210" rx="22" class="card"/><circle cx="1025" cy="220" r="42" fill="#eaf7ef"/><text x="1025" y="229" text-anchor="middle" font-size="28" class="green">ML</text><text x="1090" y="205" class="h green">ML Engineer</text><text x="1090" y="242" class="b">tested training, ranking,</text><text x="1090" y="272" class="b">and threshold-analysis suitability</text><rect x="40" y="400" width="1320" height="220" rx="22" class="soft"/><text x="700" y="440" text-anchor="middle" class="h blue">The missing direct-fit problem</text><text x="95" y="515" class="h teal">Customer context</text><text x="280" y="515" class="h">→</text><text x="330" y="515" class="h blue">Eligible offers</text><text x="500" y="515" class="h">→</text><text x="550" y="515" class="h purple">Exposure</text><text x="690" y="515" class="h">→</text><text x="740" y="515" class="h green">Response</text><text x="880" y="515" class="h">→</text><text x="930" y="515" class="h amber">Outcome</text><text x="1050" y="515" class="h">→</text><text x="1100" y="515" class="h blue">Model training</text><rect x="310" y="555" width="780" height="50" rx="25" fill="#fff0f0" stroke="#d84a4a"/><text x="700" y="588" text-anchor="middle" class="h red">No single public dataset covered the full lifecycle.</text><rect x="40" y="660" width="1320" height="84" rx="20" fill="#edf5ff" stroke="#b9d3f7"/><text x="80" y="712" class="h blue">Result:</text><text x="175" y="712" class="b">candidate research completed quickly, but direct-fit data remained limited.</text></svg>