title = "Default secret rules with one synthetic leakage-test marker"

[extend]
useDefault = true

[allowlist]
description = "Known synthetic canary in the leakage test; never a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^OWNER-PRIVATE-CANARY-9261$''']
paths = ['''^scripts/check-owner-leakage\.mjs$''']
